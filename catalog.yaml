# GEEKBMS cylindrical cell catalog (Plan A)
# Units: millimetres. Exterior envelope reference only — not a brand tolerance copy.
# STEP = clean CAD envelope (no silkscreen geometry).
# GLB / PNG = Blender visuals; GEEKBMS branding is a wrap texture only.

units: mm
plan: A
coordinate_system:
  origin: cell axis at negative end flat (z = 0)
  positive_terminal: +Z
  datum_faces:
    - cylinder_od
    - negative_end_flat
    - positive_end_shoulder_plane
glb:
  units: metres (glTF 2.0 standard; 18 mm = 0.018)
  up_axis: +Y (glTF convention; maps to STEP +Z)
  textures: embedded

cells:
  - name: "18650"
    step: cells/18650/18650_geekbms.step
    glb: cells/18650/18650_geekbms.glb
    preview: preview/18650.png
    diameter_mm: 18.0
    height_mm: 65.0
    body_height_mm: 64.2
    positive_button_diameter_mm: 6.5
    positive_button_height_mm: 0.8
    insulator_od_mm: 12.0
    wrap_style_color: blue
    cap_style_color: nickel
    bbox_diameter_mm: 18.000
    bbox_height_mm: 65.000
    step_valid: true

